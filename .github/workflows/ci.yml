name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref — a portfolio repo does not need to
# burn minutes finishing a check for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # No credential is required by anything CI runs. These are the explicit
      # local-only defaults, set so nothing can silently fall back to a
      # developer's .env or reach a real service.
      DB_URL: "sqlite:///./ci_afl_predict.db"
      API_SECRET_KEY: "ci-not-a-real-secret"
      APP_ENV: development
      ODDS_API_KEY: ""
      DISCORD_ENABLED: "false"
      DISCORD_WEBHOOK_URL: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          # requirements.lock pins exact versions. A scikit-learn or XGBoost
          # release can move a metric, so CI installs the same set the canonical
          # evaluation was produced with.
          pip install -r requirements.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Test suite
        run: pytest tests/ -q

      - name: Fresh-database migration smoke test
        run: python -m pytest tests/test_alembic_fresh_db.py -v

      # Runs the real evaluation path over a small committed fixture. CI cannot
      # reproduce the canonical artifact — that needs a gitignored 2,454-row
      # parquet and a live upstream — so this deliberately does not claim to.
      # See docs/RESULTS.md for the canonical reproduction command.
      - name: Scientific regression (frozen fixture)
        run: python -m pytest tests/test_scientific_regression.py tests/test_calibration_aggregation.py -v

      - name: Artifact schema and provenance validation
        run: python -m scripts.validate_artifact examples/backtest_canonical.json

      - name: Static typing (mypy)
        run: mypy --no-incremental orchestration/ backtesting/ models/ features/ config/

      # Proves the headline command in the README works from a clean checkout
      # with no .env file, no database, and no network egress needed.
      - name: Portfolio demo
        run: python -m demo.run_demo

      - name: Fail if the demo left the working tree dirty
        run: |
          # predictions.json is gitignored; anything else changing means a
          # generated artifact is tracked when it should not be.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::make demo modified tracked files:"
            git status --porcelain
            exit 1
          fi
