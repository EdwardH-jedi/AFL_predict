name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: development
      API_SECRET_KEY: ci-test-secret
      DB_URL: "sqlite:///:memory:"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run regression tests including fresh database migrations
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Ruff needs no project deps; install only the ruff pin from requirements-dev.txt.
      - run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      # Blocking: every rule in pyproject's select = ["E", "F", "I", "UP"] except
      # the deferred code below. E501 (line-too-long, 37 findings measured with
      # ruff 0.17.0) has no autofix and exceeds the manual-cleanup threshold, so
      # it stays ignored here and remains visible in the non-blocking report.
      # Remove it from --ignore once its findings are cleared.
      - name: Ruff (blocking, currently passing rules)
        run: python -m ruff check . --ignore E501
      # Non-blocking: full rule set, so the deferred debt stays visible on every run.
      - name: Ruff (non-blocking, full debt report)
        if: always()
        run: |
          python -m ruff check . --exit-zero
          { echo '### Ruff debt (non-blocking)'; echo '```'; python -m ruff check . --exit-zero --statistics; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
